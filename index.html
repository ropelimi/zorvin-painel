<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ropelimi Zorvin</title>
    <!--
      O ÍCONE DA ABA. O Zorvin fica aberto o dia inteiro, quase sempre ao lado
      do Vantoro e de outras abas — e sem ícone ele era o retângulo cinza que
      todo mundo tem. O título já muda com as não lidas ("(3) Zorvin"), mas o
      número não ajuda a ACHAR a aba: quem procura, procura pelo desenho.

      A ordem importa. O navegador moderno pega o SVG (escala sem borrar em
      qualquer tela e em qualquer zoom); o .ico é a rede de segurança para quem
      não entende SVG; e o apple-touch-icon é o que aparece quando alguém salva
      o painel na tela inicial do celular.
    -->
    <link rel="icon" href="/zorvin.ico" sizes="any" />
    <link rel="icon" href="/zorvin.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/zorvin-180.png" />

    <style>
      /*
        O TECLADO DO IPHONE NÃO PODE DAR ZOOM NA TELA.

        Relato: "ao clicar no campo de texto ele está expandindo a tela,
        ficando desproporcional". Não é o teclado, e não é o layout — é uma
        regra do Safari do iPhone que quase ninguém conhece: ao focar um campo
        com letra MENOR QUE 16 PIXELS, ele dá zoom na página inteira para
        aproximar o texto. E não desfaz sozinho ao sair do campo.

        O resultado é exatamente o descrito: a conversa "cresce", o cabeçalho
        sai pela esquerda, e para voltar ao normal é preciso pinçar a tela com
        dois dedos. A caixa de escrever tinha 14,5px; a de entrar, 15; a busca,
        14. Todas abaixo do corte.

        A solução conhecida do problema é `maximum-scale=1` na etiqueta do
        viewport, e ela NÃO está aqui de propósito: aquilo desliga o pinçar
        para AMPLIAR em todo o site, o que tira de quem enxerga mal a única
        ferramenta que essa pessoa tem. Levar a letra a 16px resolve a mesma
        coisa sem tirar nada de ninguém — e ainda deixa o texto maior no
        celular, que é onde ele estava pequeno demais.

        Aqui e não dentro do painel: a tela de ENTRAR também tem campos, e é a
        primeira que a equipe toca todo dia.

        `!important` porque cada campo traz o seu tamanho escrito na própria
        etiqueta, e estilo escrito ali vence folha de estilo sempre.
      */
      @media (max-width: 767px) {
        input:not([type="file"]):not([type="checkbox"]):not([type="radio"]),
        textarea,
        select { font-size: 16px !important; }
      }
    </style>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
